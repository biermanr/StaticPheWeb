name: Build and Test

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev
    workflow_dispatch:

jobs:
    editable-install-and-test:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version: ["3.10", "3.11", "3.12"]
            fail-fast: false

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                    python-version: ${{ matrix.python-version }}

            - name: Install package in editable mode with test dependencies
              run: pip install -e .[test]

            - name: Run pytest
              run: pytest --run-slow --cov src --cov-fail-under=80

            - name: Change the installation to non-editable
              run: pip install .

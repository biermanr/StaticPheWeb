name: Build and Test

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    test:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version: ["3.10", "3.11", "3.12"]
            fail-fast: false

        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                    python-version: ${{ matrix.python-version }}

            - name: Sync dependencies
              run: uv sync

            - name: Lint
              run: uv run poe lint

            - name: Typecheck
              run: uv run poe typecheck

            - name: Test (with coverage)
              run: uv run poe test-slow

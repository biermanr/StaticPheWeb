name: Deploy Pages (docs + demo)

on:
    push:
        branches:
            - main
    workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
    contents: read
    pages: write
    id-token: write

# Only one Pages deployment at a time; newer pushes supersede older ones.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                    python-version: "3.12"

            - name: Sync dependencies (incl. docs)
              run: uv sync --group docs

            # Build the documentation into the root of the Pages artifact.
            # Must run before the demo, since mkdocs cleans its output directory.
            - name: Build docs
              run: uv run mkdocs build --strict -d _site

            # Generate the example StaticPheWeb site under /demo on the same Pages site.
            - name: Generate demo dataset
              run: uv run spheweb synthetic-dataset --ref hg19 --out _demo_src --seed 0 --num-phenos 6

            - name: Build demo site
              run: uv run spheweb build static-content --phenos _demo_src/pheno-list.json --ref hg19 --out _site/demo

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                    path: _site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

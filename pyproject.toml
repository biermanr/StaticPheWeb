[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[project]
name = "spheweb"
version = "0.0.1"
dependencies = [
  "click",
  "Jinja2",
  "pydantic",
  "pandas",
  "fpdf2",
  "matplotlib",
]
requires-python = ">=3.10"
authors = [
  {name = "Rob Bierman", email = "rbierman@princeton.edu"},
]
description = "Generate static shareable websites from GWAS output"
readme = "README.md"
license = {text = "MIT License"}
keywords = ["PheWAS", "GWAS", "PheWeb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
spheweb = "spheweb:cli.spheweb"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "html5lib",
  "poethepoet",
  "mypy",
  "ruff",
]
docs = [
  "mkdocs-material",
]

[tool.uv.build-backend]
module-root = "src"
module-name = "spheweb"

[tool.poe.tasks]
test = "pytest"
test-slow = "pytest --run-slow --cov src --cov-fail-under=80"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src"
check = [
  { ref = "lint" },
  { ref = "typecheck" },
  { ref = "test" },
]
docs = "mkdocs build --strict"
docs-serve = "mkdocs serve"
# Reproduce the deployed demo locally: docs to _site/, example pheweb to _site/demo/.
demo = [
  { cmd = "mkdocs build --strict -d _site" },
  { cmd = "spheweb synthetic-dataset --ref hg19 --out _demo_src --seed 0 --num-phenos 6" },
  { cmd = "spheweb build static-content --phenos _demo_src/pheno-list.json --ref hg19 --out _site/demo" },
]

[tool.pytest.ini_options]
minversion = "7"
testpaths = ["test"]
log_cli_level = "INFO"
xfail_strict = true
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".venv",
    ".vscode",
    "__pypackages__",
    "venv",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "T201", "F", "B", "D", "I"]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
ignore = ["D203", "D211", "D213"]
extend-select = [
  "UP",  # pyupgrade
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.mypy]
strict = true
warn_unreachable = true
ignore_missing_imports = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
# cli.py is excluded because Click's decorators make full typing impractical
# (matches the established pre-commit mypy config).
exclude = ["src/spheweb/cli\\.py"]
